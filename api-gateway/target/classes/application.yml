server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: driver-service-route
          uri: lb://DRIVER-SERVICE      # lb:// = load balanced via Eureka (round-robin by default)
          predicates:
            - Path=/driver/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
